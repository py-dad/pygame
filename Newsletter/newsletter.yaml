  - headline: Franklin agrees to return land to Cherokeee
    body:Franklin town council voted unanimously Monday to return the Noquisiyi Mound, a site of deep cultural and spiritual importance, to the Eastern Band of Cherokee Indians. 
    The mound was part of a Cherokee mother town centuries before the founding of the United States but has been under private or municipal ownership for nearly 200 years.
      
    sources:
      - "https://abc11.com/post/town-franklin-gives-land-eastern-band-cherokee-indians-north-carolina/18367427/"

  - headline: More measles cases confirmed
    body:
      The North Carolina Department of Health and Human Services and Buncombe County Health and Human Services (BCHHS) Division of Public Health today announced additional cases of measles in three siblings in Buncombe County. The family had visited Spartanburg County, South Carolina, where there is a large ongoing measles outbreak approximately 1-2 weeks before the children became sick. 
      To protect the family’s privacy, no additional information about these cases will be released.
    

